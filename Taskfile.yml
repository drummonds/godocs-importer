version: "3"

tasks:
  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  check:
    desc: Run fmt, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  build:
    desc: Build the binary
    cmds:
      - go build -o bin/godocs-importer ./cmd/godocs-importer

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/

  release:*:*:
    desc: 'Release a version, e.g.: task release:v0.1.0:"initial release"'
    vars:
      TAG: "{{index .MATCH 0}}"
      BUILD: "{{index .MATCH 1}}"
    preconditions:
      - sh: git diff --quiet
        msg: "Working tree is dirty — commit or stash changes first"
      - sh: git diff --cached --quiet
        msg: "Staged changes exist — commit or stash them first"
    cmds:
      - task: check
      - git tag "{{.TAG}}" -m "{{.BUILD}}"
      - git push origin "{{.TAG}}"
      - git push
